# The mod portal page from mod-portal/, on pushing a portal-* tag (e.g.
# portal-2026-11-25): images first, then the texts, between releases too.
# Needs the repository secret FACTORIO_API_KEY with "ModPortal: Edit Mods", and
# write access for the workflow (it commits mod-portal-ids.json back).
name: Mod portal page

on:
  push:
    tags: ["portal-*"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # (all branches' history: the tag's branch, for the ids commit)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r release/requirements.txt
      - name: Release scripts' tests
        run: python -m pytest -q release/tests tests/lint

      - name: Images
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
        run: |
          python release/images.py
          if git diff --quiet -- mod-portal/images/mod-portal-ids.json; then
            echo "IDS_CHANGED=" >> "$GITHUB_ENV"
          else
            echo "IDS_CHANGED=true" >> "$GITHUB_ENV"
          fi
      - name: Texts
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
        run: python release/detail.py

      # The portal's ids and URLs belong in the repository: commit them to the
      # branch the tag is the latest commit of (main, refactor, ...); when that's
      # no branch, or more than one, keep them as an artifact to commit by hand.
      - name: Record the image ids
        if: env.IDS_CHANGED != ''
        id: record
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          branches="$(git branch -r --points-at HEAD --format='%(refname:lstrip=3)' | grep -v '^HEAD$' || true)"
          if [ "$(echo "$branches" | grep -c .)" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Mod portal image ids ($GITHUB_REF_NAME)" -- mod-portal/images/mod-portal-ids.json
            git push origin "HEAD:refs/heads/$branches"
          else
            echo "::warning::$GITHUB_REF_NAME is the latest commit of ${branches:-no branch}: commit mod-portal-ids.json from the artifact by hand"
            echo "artifact=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.record.outputs.artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mod-portal-ids
          path: mod-portal/images/mod-portal-ids.json
