[bezierio-handle]
center=Centre (moves the whole shape)
radius=A point on the circle
axis=End of one axis (sets its radius and the rotation)
width=Sets the other radius: only its distance from the first axis counts (it's projected onto the perpendicular axis, marked on the map)
start=Start of the arc (sets the radius)
end=End of the arc: only its direction counts, the arc ends where that direction meets the circle (marked on the map). The arc runs clockwise from the start.

