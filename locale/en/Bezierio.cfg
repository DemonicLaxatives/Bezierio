move-layer-down=Move layer down
; Layer list: a row's delete button (wide window only). [unreviewed]
delete-layer=Delete layer
; Layer list: the delete button on layer 0's row, which is disabled. [unreviewed]
delete-layer-0=Layer 0 runs along the curve and every other layer is placed relative to it, so it can't be deleted. Clear its item to leave the middle empty.
; Layer list: the add-layer bars above and below the list; adds a layer on that side. [unreviewed]
add-layer=Add a layer here (on the outside of this side)
; Layer list: a row's settings button (and its item icon), which opens the layer settings window. [unreviewed]
layer-settings=Layer settings (item, width, spacing, ...)
