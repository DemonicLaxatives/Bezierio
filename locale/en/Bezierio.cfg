; English texts. Above each key: the element it's for and what it does.
; "[unreviewed]" marks a comment (and its text) no human has checked yet; remove
; it once checked. New keys get a comment too, marked the same way (see
; docs/DEVELOPMENT.md, Locale).

; Window titles.
[titles]
; Main window title bar (gui/layout.lua).
gui-title=Bézierio
; Import / export window title, opened by the curve's export button (gui/string_window.lua).
curve-export=Curve export string
; Import / export window title, opened by the curve's import button.
curve-import=Import a curve
; Import / export window title, opened by the preset bar's export button.
preset-export=Preset export string
; Import / export window title, opened by the preset bar's import button.
preset-import=Import a preset
; Settings window title, opened by the gear in the main window's title bar (gui/view_settings.lua).
settings=Bézierio settings
; Layer settings window title; __1__ = the layer's index (gui/layer_view.lua).
layer-settings=Layer __1__

; Tooltips. Keys named after a layer field (offset, spacing, ...) are that
; field's tooltip in the layer settings window (gui/layer_view.lua).
[tooltip]
; Build section: the cancel button in the progress pane, while a build runs or waits (gui/control.lua).
build-cancel=Stop the build
; The Bézierio button in the top-left button bar, which opens the main window (init.lua).
bezierio-open-gui=Open Bézierio
; Build section: the Build button (plain ghost icon); builds only where nothing is in the way.
normal-build=Build
; Build section: the Force build button (yellow ghost icon); also clears trees, rocks, cliffs and lays cover tiles.
force-build=Force build
; Build section: the Super force build button (red ghost icon); also removes the player's own buildings in the way.
super-force-build=Super force build
; Build section: the Blueprint button; puts the plan in the cursor as a blueprint.
blueprint-build=Generate blueprint
; Build section: the Load from blueprint button; reads the curve and preset back from a held blueprint.
blueprint-load=Load from generated blueprint
; Layer list: a row's move-up button (wide window only).
move-layer-up=Move layer up
; Layer list: a row's move-down button (wide window only).
move-layer-down=Move layer down
; Layer list: a row's delete button (wide window only).
delete-layer=Delete layer
; Layer list: the delete button on layer 0's row, which is disabled.
delete-layer-0=Can't delete layer 0
; Layer list: the add-layer bars above and below the list; adds a layer on that side.
add-layer=Add layer
; Layer list: a row's settings button (and its item icon), which opens the layer settings window.
layer-settings=Layer settings
; Layer settings window: the OK button; closes it keeping the edits (E, the game's Confirm key, does the same).
layer-ok=Keep the changes
; Layer settings window: the Cancel button; closes it, putting the layer back (Esc does the same).
layer-cancel=Dismiss changes
; Settings window: the mark time field; how long unpowered / unfed marks stay once shown (with a finished preview's warnings, or after a build).
setting-highlight-seconds=After a build, entities that won't get power or ammo/fluid from it are marked on the map for this many seconds. Click the warning in the summary to show or hide them. 0 keeps them until you click it.
; Settings window: the cover tile slots; which cover force builds lay first, in order (build/cover.lua).
setting-cover-tiles=What tiles the force builds use for laying under tiles/entities going over water, lava, etc. It's a priority list, can be left empty and the planner will figure out what's needed.
; Settings window: the blueprint source checkbox; whether blueprints carry their curve and preset.
setting-blueprint-source=Generated blueprints carry the curve and the preset they were made from
; Settings window: the map checkbox; whether the curve, the control points with their lines, and the unpowered / unfed marks are drawn on the map too (drawing them takes longer).
setting-draw-on-map=Also draw the curve and the unpowered / unfed marks on the map. Drawing takes longer with this on.
; Settings window: the Reset button; every drawing and build setting back to its default.
settings-reset=Restore default settings
; Layer list: a row's eye toggle; whether the layer is drawn in the build preview.
layer-preview=Visualize in the build preview
; Layer settings window: the item picker; what the layer builds.
layer-type=What this layer builds
; Curve section: the pointer button; takes the curve pointer, with how to use it. Shortcuts are the player's own bindings (__CONTROL__...__).
pointer-button=Curve pointer (__CONTROL__bezierio-get-pointer__)\n__CONTROL__bezierio-pointer__ on empty ground: add a point at the end\n__CONTROL__bezierio-pointer__ on a point: select it\n__CONTROL__bezierio-pointer__ with a point selected: move it there\n__CONTROL__bezierio-pointer-insert__: add a point into the nearest stretch of curve\n__CONTROL__bezierio-select-next__ / __CONTROL__bezierio-select-previous__: select the next / previous point, if one is selected\n__CONTROL__bezierio-pointer-remove__: deselect, or remove the point under the cursor
; Curve section: the closed loop toggle (circular arrows).
closed-loop=Closed loop
; Curve section: the reverse toggle (⇄); the curve runs the other way.
reverse-points=Reverse the curve direction, so the layers swap sides
; Curve section: a point's label in the list (or its chip, narrow); selects it for the pointer.
select-point=Select this point to move it with the pointer
; Curve section: a point's delete button in the list (wide window only).
delete-point=Remove this point
; Main window title bar: the gear, which opens the settings window.
view-settings=Settings
; Layers section: the preset drop-down.
preset-select=Layer presets
; Layers section: the preset name field, shown while renaming.
preset-name=New name for this preset (Enter to save)
; Layers section: the preset bar's rename button.
preset-rename=Rename this preset
; Layers section: the preset bar's copy button.
preset-copy=Create a copy of this preset
; Layers section: the preset bar's delete button.
preset-delete=Delete this preset
; Layers section: the preset bar's delete button, disabled while only one preset is left.
preset-delete-last=The only preset can't be deleted
; Layers section: the preset bar's export button; opens the import / export window with the preset string.
preset-export=Export this preset
; Layers section: the preset bar's import button; opens the import / export window to paste a preset string.
preset-import=Import a preset from a string
; Layers section: the preset bar's new button; adds a preset with an empty layer 0.
preset-new=New preset
; Main window title bar: the pin toggle; the window stays open when other GUIs open.
pin-window=Pin: keep this window open
; Main window title bar: the chevrons in the wide window; switch to the narrow window.
narrow-window=Collapse
; Main window title bar: the chevrons in the narrow window; switch back to the wide window.
widen-window=Expand
; Title bar close button of the main, settings and import / export windows.
close-window=Close
; Curve section: the drop-down picking what to draw (curve, circle, ellipse, arc).
curve-kind=Curve type
; Curve section: the move toggle; clicks with the pointer move the curve. Shortcuts are the player's own bindings (__CONTROL__...__).
move-curve=Move: with the pointer, __CONTROL__bezierio-pointer__ moves the curve's centre to where you click; __CONTROL__bezierio-pointer-remove__ stops
; Curve section: the curve's export button (wide window only).
curve-export=Export the curve as a string
; Curve section: the curve's import button (wide window only).
curve-import=Import a curve from a string
; Import / export window: the Import button when importing a curve; replaces the current one.
curve-import-confirm=Replace the current curve
; Layer settings window: the Red wire checkbox (pole and land mine layers).
red-wire=Connect with red wire
; Layer settings window: the Green wire checkbox (pole and land mine layers).
green-wire=Connect with green wire
; Layer settings window: land mine layers' pattern drop-down.
pattern=Scattered at a density, or on a regular grid
; Layer settings window: land mine layers' grid spacing slider (grid pattern).
mine-spacing=Grid spacing in tiles (globally aligned)
; Build section summary: the tight bends warning label (gui/control.lua, totals-<name>).
totals-bends=The curve turns too sharply for the layers on the inside of a turn (red circles in the preview). They don't fit around the bend: there they get cut short, leaving gaps or stray pieces. Spread the nearby points apart to soften the bend, use fewer layers on that side, or accept the consequences.
; Build section summary: the pole gaps warning label.
totals-gaps=Neighbouring poles out of wire reach, where there was no room for a pole between them. They are left disconnected.
; Layer settings window: pole layers' Smart placement checkbox.
smart=Place the poles as far apart as the wires reach, and closer where needed so that every powered entity in the build gets power
; Layer settings window: the spacing slider of a pole layer while Smart placement is on (disabled-by-<field>). 
disabled-by-smart=Overridden by smart placement
; Build section summary: the unpowered warning label; its marks show by default, clicking hides or shows them (remembered for later plans).
totals-unpowered=Powered entities that no pole of a smart pole layer can reach. They won't get power from this build. Click to show or hide them.
; Layer settings window: tile layers' Under entities checkbox. Also in the layer list: the row label's tooltip of an underlay tile layer, after "Under entities: ".
under=Lay the tiles under the other entity layers instead; doesn't offset subsequent entity layers

; Layer settings window: every layer's Offset slider.
offset=Gap between this layer and the one closer to the middle
; Layer settings window: wall and tile layers' Checkerboard slider.
checkerboard=Checkerboard pattern: 0 = none, otherwise the size of the squares; the sign picks which squares
; Layer settings window: wall and tile layers' Width slider.
radius=Thickness of the layer
; Layer settings window: spaced layers' Spacing slider (poles, turrets, lamps, ...).
spacing=Distance between entities along the curve
; Layer settings window: rail layers' Direction slider (backwards, both ways, forwards).
direction-of-travel=Direction of travel along the curve
; Layer settings window: rail layers' Signal spacing slider. 
signal-spacing=Signal spacing, in wagon lengths
; Layer settings window: the Facing drop-down of turrets that can't turn all the way (flamethrowers).
facing=Which way turrets that can't turn all the way round point. Outward: away from the curve, on this layer's side of it (layer 0: towards layer 1's side). Inward: back towards the curve.
; Layer settings window: turret layers' targeting priority slots.
priority-targets=Gives an explicit order in which targets will be picked if multiple are in range
; Layer settings window: turret layers' Only these targets checkbox.
ignore-unprioritised=If set, targets not appearing in the priority list will never be targeted. Otherwise they come after all listed targets.
; Layer list: a row's build toggle (left of the eye); whether the layer is built.
place=Build this layer
; Layer list: tooltip of the row label of a layer that isn't built (the label is greyed); shown above the Under entities note if both apply (gui/layer_view.lua).
layer-not-placed=Not built, but still planned for, so it keeps its room
; Layer settings window: ammo turret layers' ammo picker.
ammo=Ammo the turrets request
; Layer settings window: ammo turret layers' Ammo count slider.
ammo-count=How much ammo each turret requests
; Layer settings window: lamp layers' Colour drop-down.
color=One colour for all, or a cycling rainbow along the curve
; Layer settings window: lamp layers' Rainbow length slider (rainbow colour).
rainbow-length=Tiles along the curve for one full rainbow cycle
; Layer settings window: land mine layers' Density slider (scattered pattern).
density=Percentage of the band's cells that get a mine (deterministic)
; Layer settings window: belt and pipe layers' Lines slider.
lines=Number of parallel lines
; Layer settings window: belt and pipe layers' Gap slider.
line-gap=Empty cells between the lines
; Layer settings window: belt and pipe layers' Flow drop-down.
flow=Which way along the curve things flow
; Layer settings window: pipe layers' Pump spacing slider (with Pumps on).
pump-spacing=Pipe length between pumps
; Layer settings window: pipe layers' pump picker (with Pumps on); which pump goes in the line. Only pumps one tile wide with their input and output in line fit; the base game's pump by default.
pump=The pump to put in the line. It has to fit in it: one tile wide, its input and output in line.
; Layer settings window: belt and pipe layers' Undergrounds checkbox.
undergrounds=Take long straight runs underground
; Layer settings window: pipe layers' Pumps checkbox.
pumps=Put pumps in every so often, so long pipelines keep flowing
; Layer settings window: wall layers' Gates on rails checkbox. 
gates=Where a wall lands on a straight rail, build a gate on top of it
; Layer settings window: rail layers' Gates in walls checkbox. 
wall-gates=Where the track crosses your walls, replace the walls under it with gates
; Layer settings window: rail layers' Elevated checkbox (elevated-rails mod).
elevated=Build the track with elevated rails
; Layer settings window: elevated rail layers' Ramps checkbox.
ramps=Start with a ramp up and end with a ramp down
; Layer settings window: ammo turret layers' inserter picker.
inserter=An inserter for each turret, taking ammo from a belt layer. Put a belt layer next to the turrets with one empty cell between, or as far as this inserter reaches.
; Layer settings window: fluid turret layers' Pipe feed checkbox.
pipe-feed=Connect each turret to a pipe layer next to it
; Build section summary: the unfed warning label; its marks show by default, clicking hides or shows them (remembered for later plans).
totals-unfed=Turrets set to get ammo or fluids that no belt or pipe line reaches. Click to show or hide them.

