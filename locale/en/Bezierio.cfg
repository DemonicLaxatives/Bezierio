[titles]
gui-title=Bézierio
curve-export=Export the curve
curve-import=Import a curve
preset-export=Export the preset
preset-import=Import a preset
settings=Bézierio settings
layer-settings=Layer __1__

[tooltip]
build-cancel=Cancel: stop the running build and drop the queued one (what's built so far stays; Ctrl+Z undoes it)
bezierio-open-gui=Open Bézierio
force-build=Force build
super-force-build=Super force build
blueprint-build=Blueprint: put the build in your cursor as a blueprint. It snaps onto the preview, and further copies line up end to end.
blueprint-load=Load from blueprint: hold a blueprint made with Bézierio and click to get back the curve and the preset (added as a new preset) it was made from.
move-layer-up=Move layer up
move-layer-down=Move layer down
delete-layer=Delete layer
delete-layer-0=Layer 0 runs along the curve and every other layer is placed relative to it, so it can't be deleted. Clear its item to leave the middle empty.
add-layer=Add a layer here (on the outside of this side)
layer-settings=Layer settings (item, width, spacing, ...)
layer-ok=Keep the changes
layer-cancel=Put the layer back as it was (a new layer is removed)
setting-highlight-seconds=After a build, entities that won't get power or ammo/fluid from it are marked on the map for this many seconds. Click the warning in the summary to show or hide them. 0 keeps them until you click it.
setting-blueprint-source=Blueprints from the Blueprint button carry the curve and the preset they were made from. Hold one and click Load from blueprint to get them back.
settings-reset=Put every setting back to its default
layer-preview=Show this layer in the build preview (pressed) or not. Only the drawing: whether it's built is the toggle on its left.
layer-type=What this layer builds
pointer-button=Curve pointer (Alt+B)\nClick empty ground: add a point at the end\nClick a point: select it\nClick with a point selected: move it there\nShift + click: add a point into the nearest stretch of curve\nShift + mouse wheel: select the next / previous point\nRight-click: deselect, or remove the point under the cursor
closed-loop=Closed loop: connect the last point back to the first
reverse-points=Reverse: the curve runs the other way, so the layers swap sides (for a circle, inside and outside). The points stay as they are.
select-point=Select this point to move it with the pointer
delete-point=Remove this point
view-settings=Settings: colours and opacity of the drawing, marks after a build, blueprints
preset-select=Layer preset: switch to another saved layer stack
preset-name=New name for this preset (Enter to save)
preset-rename=Rename this preset
preset-copy=Copy this preset as a new one
preset-delete=Delete this preset
preset-delete-last=The only preset can't be deleted
preset-export=Export this preset as a string to share
preset-import=Import a preset from a string
preset-new=New preset (just an empty layer 0)
pin-window=Pin: keep this window open when other windows open or Esc is pressed
narrow-window=Narrow the window: only the everyday controls (points as chips, layers without their buttons)
widen-window=Widen the window: all the controls
close-window=Close
curve-kind=What to draw: a curve through any number of points, or a circle, ellipse or arc placed with a few handles (each keeps its own points)
move-curve=Move: click with the pointer to move the curve's centre there. Right-click to stop.
curve-export=Export the curve (every kind's points) as a string
curve-import=Import a curve from a string
curve-import-confirm=Replace the curve with the pasted one
red-wire=Connect them with red wire
green-wire=Connect them with green wire
pattern=Scattered at a density, or on a regular grid
mine-spacing=Grid spacing in tiles (aligned to the map)
totals-bends=The curve turns too sharply here for the layers on the inside of the turn (red circles in the preview). They don't fit around the bend: there they get cut short, leaving gaps or stray pieces. Spread the nearby points apart to soften the bend, or use fewer layers on that side.
totals-gaps=Neighbouring poles out of wire reach, where there was no room for a pole between them. They are left unconnected.
smart=Place the poles as far apart as the wires reach, and closer where needed so that every powered entity in the build (turrets, roboports, ...) gets power. Like dragging poles in the game.
disabled-by-smart=Not used with smart placement
totals-unpowered=Powered entities that no pole of a smart pole layer can reach. They won't get power from this build. Click to show or hide them.
under=Lay the tiles under the other layers instead of beside them: the next layer out starts where this one starts, and sits on these tiles

offset=Gap between this layer and the one closer to the middle
checkerboard=Checkerboard pattern: 0 = none, otherwise the size of the squares; the sign picks which squares
radius=Thickness of the layer
spacing=Distance between entities along the curve
direction-of-travel=Direction of travel along the curve
signal-spacing=Signal spacing, in wagons
facing=Which way turrets that can't turn all the way round point. Outward: away from the curve, on this layer's side of it (layer 0: towards layer 1's side). Inward: back towards the curve. On diagonal stretches they face diagonally where the turret can.
priority-targets=Targeting priorities: what these turrets shoot first, in this order. Pick an enemy (or an asteroid) in the empty slot to add it; clear a slot to remove it.
ignore-unprioritised=Only shoot what is in the priority list
place=Place this layer (pressed) or not. Not placed, it builds nothing but keeps its room, so the layers outside it stay where they are.
layer-not-placed=Not placed: keeps its room, builds nothing (the build toggle on the left)
ammo=Ammo the turrets request (ghosts get it delivered with them; instant builds are loaded straight away)
ammo-count=How much ammo each turret requests
color=Lamp colour: the lamp's own, one colour, or a rainbow along the curve
rainbow-length=Tiles along the curve for one full rainbow
density=Percentage of the band's cells that get a mine (the same cells every time)
lines=How many lines side by side
line-gap=Empty cells between the lines (pipes need at least one, or neighbouring lines would join)
flow=Which way along the curve things flow
pump-spacing=Pipe length between pumps: a pipeline can only span so far (the pipe's maximum pipeline extent, 320 tiles by default), so this stays below that
undergrounds=Take long straight runs underground (entrance after a turn, exit before the next)
pumps=Put pumps in every so often, so long pipelines keep flowing
gates=Where a wall lands on a straight rail, build a gate instead (the rail stays)
wall-gates=Where the track crosses your walls, replace the walls under it with gates
elevated=Build the track on elevated rails, with rail supports placed as far apart as they reach
ramps=Start with a ramp up and end with a ramp down (ramps only go on north, south, east or west track: start and end the curve that way)
inserter=An inserter for each turret, taking ammo from a belt layer. Put a belt layer next to the turrets with one empty cell between (the turret layer's Offset), or as far as this inserter reaches
pipe-feed=Pipe each turret to a pipe layer next to it (a short stub of pipe from one of its fluid connections)
totals-unfed=Turrets set to get an inserter or a pipe that no belt or pipe line reaches. Click to show or hide them.

