; Chat messages to the player.
[bezierio-message]
; A build, blueprint or preview asked for with fewer than two points. 
need-two-points=Bézierio: place at least two control points first.
; A build asked for by a player whose permission group can't build. 
not-allowed=Bézierio: your permission group can't build.
; A layer whose type the planner doesn't support; __1__ = layer index. 
unsupported-layer=Bézierio: layer __1__ uses a type that isn't supported yet, skipped.
; After a ghost build: __1__ placed, __2__ already there, __3__ blocked. 
build-result=Bézierio: __1__ ghosts placed, __2__ already there, __3__ blocked.
; After an instant build (cheat mode, map editor): __1__ built, __2__ already there, __3__ blocked. 
build-result-instant=Bézierio: __1__ built, __2__ already there, __3__ blocked.
; After a force build that laid cover tiles; __1__ = how many. 
covered=Bézierio: __1__ cover tiles (landfill, foundation, ...) laid where the existing tiles couldn't support the build.
; After a build with pole gaps; __1__ = how many. 
pole-gaps=Bézierio: __1__ pole gaps out of wire reach where there was no room for a pole in between.
