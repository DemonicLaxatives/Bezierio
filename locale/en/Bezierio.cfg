layer-ok=Keep the changes
; Layer settings window: the Cancel button; closes it, putting the layer back (Esc does the same). [unreviewed]
layer-cancel=Put the layer back as it was (a new layer is removed)
; Settings window: the mark time field; how long unpowered / unfed marks stay after a build. [unreviewed]
setting-highlight-seconds=After a build, entities that won't get power or ammo/fluid from it are marked on the map for this many seconds. Click the warning in the summary to show or hide them. 0 keeps them until you click it.
; Settings window: the cover tile slots; which cover force builds lay first, in order (build/cover.lua). [unreviewed]
setting-cover-tiles=What force builds lay where the ground can't take what's planned (water, lava, ...): the first of these that fits there. With none set, or none fitting, the game's own choice for that ground (landfill on water, foundation on lava, ...).
; Settings window: the blueprint source checkbox; whether blueprints carry their curve and preset. [unreviewed]
setting-blueprint-source=Blueprints from the Blueprint button carry the curve and the preset they were made from. Hold one and click Load from blueprint to get them back.
