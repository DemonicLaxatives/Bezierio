; Build section: the cancel button in the progress pane, while a build runs or waits (gui/control.lua). [unreviewed]
build-cancel=Cancel: stop the running build and drop the queued one (what's built so far stays; Ctrl+Z undoes it)
; The Bézierio button in the top-left button bar, which opens the main window (init.lua). [unreviewed]
bezierio-open-gui=Open Bézierio
; Build section: the Build button (plain ghost icon); builds only where nothing is in the way. [unreviewed]
normal-build=Build: ghosts (or, in cheat mode and the map editor, the real thing) wherever nothing is in the way.
; Build section: the Force build button (yellow ghost icon); also clears trees, rocks, cliffs and lays cover tiles. [unreviewed]
force-build=Force build: as Build, and trees, rocks and cliffs in the way are marked for deconstruction, and landfill, foundation or other cover goes down where the ground can't take what's planned.
; Build section: the Super force build button (red ghost icon); also removes the player's own buildings in the way. [unreviewed]
super-force-build=Super force build: as Force build, and your own buildings in the way are marked for deconstruction too.
; Build section: the Blueprint button; puts the plan in the cursor as a blueprint. [unreviewed]
blueprint-build=Blueprint: put the build in your cursor as a blueprint. It snaps onto the preview, and further copies line up end to end.
; Build section: the Load from blueprint button; reads the curve and preset back from a held blueprint. [unreviewed]
blueprint-load=Load from blueprint: hold a blueprint made with Bézierio and click to get back the curve and the preset (added as a new preset) it was made from.
