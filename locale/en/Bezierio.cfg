[mod-setting-description]
bezierio-work-budget=How much planning, drawing and building Bézierio does per player per tick. Higher finishes sooner but makes each tick slower.

[bezierio-message]
need-two-points=Bézierio: place at least two control points first.
not-allowed=Bézierio: your permission group can't build.
unsupported-layer=Bézierio: layer __1__ uses a type that cannot be built yet, skipped.
build-result=Bézierio: __1__ ghosts placed, __2__ already there, __3__ blocked.
build-result-instant=Bézierio: __1__ built, __2__ already there, __3__ blocked.
pole-gaps=Bézierio: __1__ pole gaps out of wire reach where there was no room for a pole in between.
unpowered=Bézierio: __1__ powered entities are out of reach of the smart pole line.
blueprint-done=Bézierio: blueprint in your cursor: __1__ entities, __2__ tiles.
blueprint-empty=Bézierio: nothing to put in a blueprint.
blueprint-cursor=Bézierio: couldn't put the blueprint in your cursor (is your inventory full?).
preset-not-a-preset=Bézierio: that's not a Bézierio preset string.
preset-unknown-version=Bézierio: that preset string is from a newer version of Bézierio.
preset-too-many=Bézierio: you have the maximum number of presets; delete one first.
preset-missing-items=Bézierio: these items aren't available, their layers were left empty: __1__
